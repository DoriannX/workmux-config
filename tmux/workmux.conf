# Fragment tmux pour workmux. Charge depuis ~/.tmux.conf par :
#   source-file ~/projects/workmux-config/tmux/workmux.conf

# Ctrl-b g : dashboard workmux en fenetre flottante, par-dessus le pane courant.
# -E ferme la popup quand la commande se termine ; `g` est libre dans les
# raccourcis par defaut. Chemin complet : la popup n'est pas un shell de login.
bind-key g display-popup -E -w 90% -h 90% "$HOME/.local/bin/workmux dashboard"

# Ctrl-b G : colonne d'etat permanente des worktrees (bascule).
bind-key G run-shell "$HOME/.local/bin/workmux sidebar"

# Ctrl-b A : nouveau worktree a partir d'un prompt (`workmux add -A`), la branche
# est nommee par le LLM. `A` est libre dans les raccourcis par defaut de tmux.
# `-d` : la popup herite du depot du pane courant, sinon `workmux add` ne sait
# pas dans quel depot creer le worktree.
bind-key A display-popup -E -w 80% -h 30% -d "#{pane_current_path}" "$HOME/.local/bin/workmux-add-auto"

# Ctrl-Backspace (octet 0x08) traite comme Ctrl-Backspace par omp, y compris
# dans les panes lances directement sans passer par le shell.
set-environment -g PI_TUI_RAW_BACKSPACE_IS_CTRL 1
